name: Release GPS-SMART MANAGEMENT

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versi rilis, contoh v0.1.1 (harus sama dengan versi aplikasi)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish signed Windows update
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Validate updater signing configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "Missing repository variable TAURI_UPDATER_PUBLIC_KEY. Configure the Tauri updater public key before publishing a release."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY. Configure the matching private signing key before publishing a release."
          }
          if ($env:TAURI_UPDATER_PUBLIC_KEY -match "MUST_BE_CONFIGURED|PLACEHOLDER") {
            throw "TAURI_UPDATER_PUBLIC_KEY is still a placeholder. Use the public key paired with TAURI_SIGNING_PRIVATE_KEY."
          }
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate release version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $configVersion = [string]$config.version
          $packageVersion = [string]$package.version
          if ($configVersion -ne $packageVersion) {
            throw "Version mismatch: tauri.conf.json=$configVersion, package.json=$packageVersion"
          }
          $cargoVersionMatch = [regex]::Match($cargo, '(?m)^version = "([^"]+)"')
          if (-not $cargoVersionMatch.Success -or $cargoVersionMatch.Groups[1].Value -ne $configVersion) {
            throw "src-tauri/Cargo.toml version does not match $configVersion"
          }
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -ne "v$configVersion") {
            throw "Requested tag must be v$configVersion to match the application version."
          }
      - name: Apply updater public key to release configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json"
      - name: Build and publish GitHub release with updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TAURI_UPDATER_ENABLED: "true"
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "GPS-SMART MANAGEMENT ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: |
            GPS-SMART MANAGEMENT Windows release.
            Updates are signed and distributed through the built-in updater.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: "--bundles nsis"
