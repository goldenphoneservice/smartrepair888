name: Release GPS-SMART MANAGEMENT

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versi rilis, contoh v0.1.1 (harus sama dengan versi aplikasi)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish signed Windows update
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Validate updater signing configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { throw "Missing repository variable TAURI_UPDATER_PUBLIC_KEY." }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY." }
          if ($env:TAURI_UPDATER_PUBLIC_KEY -match "MUST_BE_CONFIGURED|PLACEHOLDER") { throw "TAURI_UPDATER_PUBLIC_KEY is a placeholder." }
      - name: Refresh lockfile for updater dependencies
        run: npm install --package-lock-only
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate release version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $v = [string]$config.version
          if ($v -ne [string]$package.version) { throw "Version mismatch between Tauri and package.json." }
          $m = [regex]::Match($cargo, '(?m)^version = "([^"]+)"')
          if (-not $m.Success -or $m.Groups[1].Value -ne $v) { throw "Cargo version mismatch." }
          $tag = if ($env:REQUESTED_TAG) { $env:REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -ne "v$v") { throw "Release tag must be v$v." }
      - name: Inject public key and enable signed updater artifacts
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json"
      - name: Build and publish signed Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TAURI_UPDATER_ENABLED: "true"
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "GPS-SMART MANAGEMENT ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: |
            GPS-SMART MANAGEMENT Windows release.
            Signed updates are distributed through the built-in updater.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: "--bundles nsis"
